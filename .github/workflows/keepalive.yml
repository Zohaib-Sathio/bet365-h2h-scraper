# Render's free plan spins a service down after 15 minutes without traffic, and
# the cold start that follows costs the visitor about a minute. A cheap ping
# keeps the instance warm during the day.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://bet365-h2h.onrender.com/healthz)
          echo "healthz -> $code"
          test "$code" = "200"
